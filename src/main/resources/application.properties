spring.application.name=demo
spring.config.import=optional:file:.env[.properties]

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}
spring.datasource.username=${MYSQL_USER:demo_user}
spring.datasource.password=${MYSQL_PASSWORD:demo_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway adds the stock tables to an existing schema safely.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Redis stores the latest quote for fast reads; MySQL remains the source of history.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# DhanHQ credentials must be supplied through the environment. Never commit them.
dhan.client-id=${DHAN_CLIENT_ID:}
dhan.access-token=${DHAN_ACCESS_TOKEN:}
dhan.api-base-url=https://api.dhan.co/v2
dhan.feed-url=wss://api-feed.dhan.co
dhan.backfill-enabled=${DHAN_BACKFILL_ENABLED:true}
dhan.live-feed-enabled=${DHAN_LIVE_FEED_ENABLED:true}
dhan.backfill-from=${DHAN_BACKFILL_FROM:2026-07-01T09:15:00}
dhan.backfill-to=${DHAN_BACKFILL_TO:}
dhan.market-zone=Asia/Kolkata
dhan.market-open=09:15
dhan.market-close=15:30

# Settings credentials are supplied through the environment. Secret values persisted in MySQL use AES-GCM.
settings.admin-username=${SETTINGS_ADMIN_USERNAME:admin}
settings.admin-password=${SETTINGS_ADMIN_PASSWORD:}
settings.encryption-key=${SETTINGS_ENCRYPTION_KEY:}

# Analytics runs continuously inside the application, independently of connected browser sessions.
analytics.refresh-ms=${ANALYTICS_REFRESH_MS:1000}

# OpenAI is called server-side only. The key is read from the encrypted settings table.
openai.api-base-url=https://api.openai.com
openai.model=${OPENAI_MODEL:gpt-5.6-terra}
openai.analysis-refresh-ms=${OPENAI_ANALYSIS_REFRESH_MS:60000}

# Separate scheduler threads keep one slow external API call from pausing market calculations.
spring.task.scheduling.pool.size=4

# Health and metrics are scraped only through the private Docker network.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.server.port=9091

# Paper execution is deterministic and never places broker orders.
paper.enabled=${PAPER_TRADING_ENABLED:true}
paper.starting-capital=${PAPER_STARTING_CAPITAL:1000000}
paper.risk-per-trade=${PAPER_RISK_PER_TRADE:0.01}
paper.max-open-positions=${PAPER_MAX_OPEN_POSITIONS:5}
paper.max-daily-loss=${PAPER_MAX_DAILY_LOSS:0.03}
paper.max-hold-minutes=${PAPER_MAX_HOLD_MINUTES:30}
paper.slippage-bps=${PAPER_SLIPPAGE_BPS:5}
paper.transaction-cost-bps-per-side=${PAPER_TRANSACTION_COST_BPS_PER_SIDE:8}

# HTTP clients fail closed instead of blocking scheduler threads indefinitely.
external.connect-timeout=${EXTERNAL_CONNECT_TIMEOUT:10s}
external.read-timeout=${EXTERNAL_READ_TIMEOUT:20s}
security.allowed-origin=${ALLOWED_ORIGIN:https://nse.revvlabs.tech}

# Keep high-volume candle ingestion logs compact.
debug=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.jdbc.core=INFO
