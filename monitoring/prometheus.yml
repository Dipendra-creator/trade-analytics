global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: trade-analytics
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:9091"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: mysql
    static_configs:
      - targets: ["mysql-exporter:9104"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
