name: Qualification

on:
  push:
    branches: [main, reliability/qualification]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit and integration tests
        run: bash mvnw -B verify
      - name: Build production container
        run: docker build --tag trade-analytics:${{ github.sha }} .
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: trade-analytics:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload vulnerability report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
